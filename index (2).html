<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf6f1">
  <meta name="description" content="Mindful Habits — a gentle self-care companion by MentorHealth Philippines. Demonstration prototype, not a clinical or emergency service.">
  <title>Mindful Habits · MentorHealth Philippines</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#home" data-nav="home" aria-label="Mindful Habits home">
        <span class="brand-mark">✿</span><span><b>mindful<span class="brand-soft">habits</span></b><small>by MentorHealth Philippines</small></span>
      </a>
      <div class="sidebar-section-label">YOUR LITTLE SPACE</div>
      <nav id="sidebar-nav" class="side-nav"></nav>
      <div class="sidebar-bottom">
        <div class="mini-note"><span class="mini-note-icon">♡</span><b>A gentle reminder</b><p>You don't need to feel okay all the time to be worthy of care.</p></div>
        <button class="link-button" data-action="about">About this project <span aria-hidden="true">↗</span></button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="topbar-left"><span class="topbar-icon" aria-hidden="true">✳</span><span id="section-eyebrow">YOUR LITTLE SPACE</span></div><div class="topbar-right"><span class="prototype-pill">● Interactive prototype</span><button id="settings-button" class="icon-button" data-nav="settings" aria-label="Open settings" title="Settings">⚙</button></div></header>
      <main id="screen" class="screen" tabindex="-1"></main>
      <footer class="footer"><span>Made with care, for young people. ♡</span><span>Not a diagnostic or emergency service</span></footer>
    </div>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Mobile navigation"></nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
</body>
</html>
